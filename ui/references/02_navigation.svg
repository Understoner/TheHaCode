<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <style>
    .sheet-title { font-size: 26px; font-weight: 600; fill: #16242B; letter-spacing: -0.4px; }
    .sheet-sub   { font-size: 14px; fill: #5A6B75; }
    .frame-label { font-size: 12px; font-weight: 600; fill: #5A6B75; letter-spacing: 0.6px; }
    .note        { font-size: 11px; fill: #8C9AA3; }
    .note-b      { font-size: 11px; font-weight: 600; fill: #5A6B75; }
    .cap         { font-size: 12px; font-weight: 600; fill: #16242B; }
    .line        { stroke: #E8EDF1; stroke-width: 1; }
    .measure     { stroke: #B9D4E0; stroke-width: 1; }
  </style>

  <rect width="1600" height="1060" fill="#EFF3F4"/>

  <text x="64" y="56" class="sheet-title">Menüführung</text>
  <text x="64" y="80" class="sheet-sub">Vier Ziele, drei Anordnungen. Reihenfolge und Beschriftung ändern sich nie — nur die Position.</text>

  <!-- ===================== MOBILE TAB BAR ===================== -->
  <text x="64" y="132" class="frame-label">&lt; 768 px — TAB-BAR UNTEN</text>
  <g transform="translate(64,152)">
    <rect x="0" y="0" width="390" height="120" rx="14" fill="#FFFFFF" stroke="#D3DCE3"/>
    <line x1="0" y1="1" x2="390" y2="1" class="line"/>

    <g transform="translate(48,30)">
      <rect x="-9" y="0" width="20" height="20" rx="6" fill="none" stroke="#3B6C82" stroke-width="1.6"/>
      <text x="1" y="40" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#3B6C82">Start</text>
      <rect x="-22" y="-14" width="46" height="66" rx="10" fill="none" stroke="#B9D4E0" stroke-width="1" stroke-dasharray="2 3"/>
    </g>
    <g transform="translate(146,30)">
      <circle cx="1" cy="10" r="9.5" fill="none" stroke="#8C9AA3" stroke-width="1.6"/>
      <text x="1" y="40" text-anchor="middle" style="font-size:10px;fill:#8C9AA3">Üben</text>
    </g>
    <g transform="translate(244,30)">
      <path d="M-8 2 h18 M-8 10 h18 M-8 18 h11" fill="none" stroke="#8C9AA3" stroke-width="1.6" stroke-linecap="round"/>
      <text x="1" y="40" text-anchor="middle" style="font-size:10px;fill:#8C9AA3">Meine</text>
    </g>
    <g transform="translate(342,30)">
      <circle cx="0" cy="6" r="5" fill="none" stroke="#8C9AA3" stroke-width="1.6"/>
      <path d="M-8 19 a8 8 0 0 1 16 0" fill="none" stroke="#8C9AA3" stroke-width="1.6"/>
      <text x="0" y="40" text-anchor="middle" style="font-size:10px;fill:#8C9AA3">Profil</text>
    </g>
    <rect x="145" y="104" width="100" height="4" rx="2" fill="#D3DCE3"/>
  </g>

  <g>
    <line x1="42" y1="152" x2="42" y2="256" class="measure"/>
    <text x="8" y="208" class="note">66px</text>
    <path d="M92 130 v14" class="measure"/>
    <text x="102" y="140" class="note-b">Trefferfläche 46 × 66 px</text>
    <text x="102" y="154" class="note">gestrichelt eingezeichnet, mindestens 44 × 44</text>
  </g>
  <text x="64" y="298" class="note">Aktiv: Icon und Label in ocean700 (#3B6C82), Strichstärke 1.6. Kein Hintergrund, keine Pille — die Farbe reicht.</text>
  <text x="64" y="314" class="note">Inaktiv: inkSubtle (#8C9AA3). „Meine" ist bewusst kurz — „Meine Sequenzen" bricht auf kleinen Geräten um.</text>
  <text x="64" y="330" class="note">Unter der Bar liegt env(safe-area-inset-bottom); auf iPhones mit Home-Indikator wächst die Höhe entsprechend.</text>

  <!-- ===================== TABLET RAIL ===================== -->
  <text x="560" y="132" class="frame-label">768 – 1023 px — ICON-RAIL LINKS</text>
  <g transform="translate(560,152)">
    <rect x="0" y="0" width="76" height="330" rx="14" fill="#FFFFFF" stroke="#D3DCE3"/>
    <line x1="75" y1="0" x2="75" y2="330" class="line"/>

    <rect x="14" y="24" width="48" height="48" rx="12" fill="#F0F6F9"/>
    <rect x="29" y="39" width="18" height="18" rx="5" fill="none" stroke="#3B6C82" stroke-width="1.6"/>

    <circle cx="38" cy="104" r="9" fill="none" stroke="#5A6B75" stroke-width="1.6"/>
    <path d="M29 152 h18 M29 160 h18 M29 168 h11" fill="none" stroke="#5A6B75" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="38" cy="216" r="5" fill="none" stroke="#5A6B75" stroke-width="1.6"/>
    <path d="M30 230 a8 8 0 0 1 16 0" fill="none" stroke="#5A6B75" stroke-width="1.6"/>

    <line x1="16" y1="266" x2="60" y2="266" class="line"/>
    <circle cx="38" cy="296" r="12" fill="#F2F6F1"/>
    <path d="M33 296 l4 4 l8 -8" fill="none" stroke="#5F7F5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="560" y="512" class="note">Ohne Beschriftung, dafür mit `aria-label` und Tooltip nach 600 ms.</text>
  <text x="560" y="528" class="note">Die grüne Zahl unten ist die Trial-Restlaufzeit — der einzige</text>
  <text x="560" y="544" class="note">Ort, an dem in der Rail eine Zahl steht.</text>

  <!-- ===================== DESKTOP SIDEBAR ===================== -->
  <text x="760" y="132" class="frame-label">≥ 1024 px — SIDEBAR MIT BESCHRIFTUNG</text>
  <g transform="translate(760,152)">
    <rect x="0" y="0" width="224" height="330" rx="14" fill="#FFFFFF" stroke="#D3DCE3"/>
    <line x1="223" y1="0" x2="223" y2="330" class="line"/>

    <text x="24" y="40" style="font-size:14px;font-weight:600;fill:#16242B;letter-spacing:0.4px">thehacode</text>

    <rect x="12" y="66" width="200" height="38" rx="10" fill="#F0F6F9"/>
    <rect x="28" y="78" width="16" height="16" rx="5" fill="none" stroke="#3B6C82" stroke-width="1.6"/>
    <text x="56" y="91" style="font-size:13px;font-weight:600;fill:#3B6C82">Start</text>

    <circle cx="36" cy="126" r="8" fill="none" stroke="#5A6B75" stroke-width="1.6"/>
    <text x="56" y="131" style="font-size:13px;fill:#5A6B75">Üben</text>

    <path d="M28 158 h16 M28 165 h16 M28 172 h10" fill="none" stroke="#5A6B75" stroke-width="1.6" stroke-linecap="round"/>
    <text x="56" y="170" style="font-size:13px;fill:#5A6B75">Meine Sequenzen</text>

    <circle cx="36" cy="203" r="5" fill="none" stroke="#5A6B75" stroke-width="1.6"/>
    <path d="M28 216 a8 8 0 0 1 16 0" fill="none" stroke="#5A6B75" stroke-width="1.6"/>
    <text x="56" y="211" style="font-size:13px;fill:#5A6B75">Profil</text>

    <rect x="12" y="252" width="200" height="60" rx="10" fill="#F2F6F1"/>
    <text x="28" y="276" style="font-size:12px;font-weight:600;fill:#5F7F5B">Eigener Rhythmus</text>
    <text x="28" y="294" style="font-size:11px;fill:#5F7F5B">Ohne Konto testen ›</text>
  </g>

  <!-- ===================== STATES ===================== -->
  <text x="1060" y="132" class="frame-label">ZUSTÄNDE EINES EINTRAGS</text>
  <g transform="translate(1060,152)">
    <rect x="0" y="0" width="476" height="330" rx="14" fill="#FFFFFF" stroke="#D3DCE3"/>

    <text x="24" y="34" class="cap">Ruhend</text>
    <rect x="24" y="44" width="200" height="38" rx="10" fill="#FFFFFF"/>
    <circle cx="48" cy="63" r="8" fill="none" stroke="#5A6B75" stroke-width="1.6"/>
    <text x="68" y="68" style="font-size:13px;fill:#5A6B75">Üben</text>

    <text x="252" y="34" class="cap">Zeiger darüber</text>
    <rect x="252" y="44" width="200" height="38" rx="10" fill="#FAFBFC"/>
    <circle cx="276" cy="63" r="8" fill="none" stroke="#16242B" stroke-width="1.6"/>
    <text x="296" y="68" style="font-size:13px;fill:#16242B">Üben</text>

    <text x="24" y="122" class="cap">Aktiv</text>
    <rect x="24" y="132" width="200" height="38" rx="10" fill="#F0F6F9"/>
    <circle cx="48" cy="151" r="8" fill="none" stroke="#3B6C82" stroke-width="1.6"/>
    <text x="68" y="156" style="font-size:13px;font-weight:600;fill:#3B6C82">Üben</text>

    <text x="252" y="122" class="cap">Tastaturfokus</text>
    <rect x="252" y="132" width="200" height="38" rx="10" fill="#FFFFFF"/>
    <rect x="250" y="130" width="204" height="42" rx="12" fill="none" stroke="#3B6C82" stroke-width="2"/>
    <circle cx="276" cy="151" r="8" fill="none" stroke="#16242B" stroke-width="1.6"/>
    <text x="296" y="156" style="font-size:13px;fill:#16242B">Üben</text>

    <text x="24" y="212" class="cap">Gesperrt (ohne Plus)</text>
    <rect x="24" y="222" width="200" height="38" rx="10" fill="#FFFFFF"/>
    <path d="M44 244 v-5 a4 4 0 0 1 8 0 v5" fill="none" stroke="#8C9AA3" stroke-width="1.4"/>
    <rect x="41" y="244" width="14" height="10" rx="2.5" fill="none" stroke="#8C9AA3" stroke-width="1.4"/>
    <text x="68" y="246" style="font-size:13px;fill:#8C9AA3">Neue Sequenz</text>

    <line x1="24" y1="284" x2="452" y2="284" class="line"/>
    <text x="24" y="306" class="note">Der Fokusring ist 2 px ocean700 mit 2 px Abstand — er darf nie per `outline: none` entfernt werden.</text>
    <text x="24" y="320" class="note">Gesperrt heißt sichtbar, nicht versteckt: der Weg zu Plus muss erkennbar bleiben.</text>
  </g>

  <!-- ===================== ROUTES ===================== -->
  <g transform="translate(64,600)">
    <text x="0" y="0" class="note-b">ROUTEN (EXPO ROUTER)</text>
    <rect x="0" y="16" width="700" height="220" rx="14" fill="#FFFFFF" stroke="#D3DCE3"/>
    <g style="font-size:12px;fill:#16242B">
      <text x="24" y="46" style="font-weight:600">app/(public)/index.tsx</text>
      <text x="300" y="46" style="fill:#5A6B75">Startscreen · statisch · ohne Anmeldung lesbar</text>

      <text x="24" y="74" style="font-weight:600">app/(public)/neu/[slug].tsx</text>
      <text x="300" y="74" style="fill:#5A6B75">News-Beitrag · statisch · eigene Meta-Tags</text>

      <text x="24" y="102" style="font-weight:600">app/(app)/ueben/index.tsx</text>
      <text x="300" y="102" style="fill:#5A6B75">Katalog aller sichtbaren Sequenzen</text>

      <text x="24" y="130" style="font-weight:600">app/(app)/ueben/[id].tsx</text>
      <text x="300" y="130" style="fill:#5A6B75">Player — Vollbild, ohne Navigation</text>

      <text x="24" y="158" style="font-weight:600">app/(app)/meine/index.tsx</text>
      <text x="300" y="158" style="fill:#5A6B75">Eigene Sequenzen · Anmeldung nötig</text>

      <text x="24" y="186" style="font-weight:600">app/(app)/meine/[id]/bearbeiten.tsx</text>
      <text x="300" y="186" style="fill:#5A6B75">Konfigurator · Plus nötig zum Speichern</text>

      <text x="24" y="214" style="font-weight:600">app/(app)/profil/index.tsx</text>
      <text x="300" y="214" style="fill:#5A6B75">Konto, Abo, Einwilligungen, Export, Löschen</text>
    </g>
  </g>

  <g transform="translate(820,600)">
    <text x="0" y="0" class="note-b">REGELN, DIE OFT VERLETZT WERDEN</text>
    <rect x="0" y="16" width="716" height="220" rx="14" fill="#FFFFFF" stroke="#D3DCE3"/>
    <text x="24" y="46" class="note">Der Player blendet die Navigation vollständig aus. Wer atmet, soll nichts anderes sehen —</text>
    <text x="24" y="62" class="note">Ausstieg nur über „Beenden" oben links, kein versehentliches Wegtippen.</text>

    <text x="24" y="94" class="note">Die vier Ziele sind fix. Kommt in V1.1 das Tagebuch, ersetzt es „Meine" nicht, sondern rückt</text>
    <text x="24" y="110" class="note">an dritte Stelle — vier Tabs bleiben, „Profil" wandert ins Kopfmenü.</text>

    <text x="24" y="142" class="note">Kein Hamburger-Menü. Bei vier Zielen versteckt es Funktionen ohne Gewinn.</text>

    <text x="24" y="174" class="note">Ohne Anmeldung sind Start und News erreichbar; jeder Klick auf „Meine" führt zur Anmeldung,</text>
    <text x="24" y="190" class="note">nicht zu einer Fehlermeldung. Die Route merkt sich das Ziel und öffnet es nach dem Login.</text>

    <text x="24" y="222" class="note">Zurück-Geste und Browser-Zurück müssen identisch funktionieren — die PWA läuft in beiden Welten.</text>
  </g>

  <text x="64" y="920" class="note-b">FORMFAKTOR-MATRIX</text>
  <g transform="translate(64,936)" style="font-size:12px">
    <rect x="0" y="0" width="1472" height="88" rx="12" fill="#FFFFFF" stroke="#D3DCE3"/>
    <line x1="0" y1="30" x2="1472" y2="30" class="line"/>
    <g style="fill:#5A6B75;font-weight:600">
      <text x="24" y="20">Breite</text><text x="220" y="20">Navigation</text><text x="480" y="20">Inhalt</text>
      <text x="820" y="20">Atem-Animation</text><text x="1140" y="20">Konfigurator</text>
    </g>
    <g style="fill:#16242B">
      <text x="24" y="50">&lt; 768 px</text><text x="220" y="50">Tab-Bar unten</text><text x="480" y="50">eine Spalte, Listen</text>
      <text x="820" y="50">Form 260 px, zentriert</text><text x="1140" y="50">Vorschau oben, Regler darunter</text>
      <text x="24" y="72">768 – 1023</text><text x="220" y="72">Icon-Rail links</text><text x="480" y="72">zwei Spalten</text>
      <text x="820" y="72">Form 340 px</text><text x="1140" y="72">wie Mobile, breitere Regler</text>
    </g>
    <text x="24" y="94" style="fill:#16242B"></text>
  </g>
  <text x="88" y="1046" style="font-size:12px;fill:#16242B">≥ 1024 px</text>
  <text x="284" y="1046" style="font-size:12px;fill:#16242B">Sidebar mit Text</text>
  <text x="544" y="1046" style="font-size:12px;fill:#16242B">Raster, max. 1120 px</text>
  <text x="884" y="1046" style="font-size:12px;fill:#16242B">Form 420 px</text>
  <text x="1204" y="1046" style="font-size:12px;fill:#16242B">Regler links, Vorschau rechts fixiert</text>
</svg>
