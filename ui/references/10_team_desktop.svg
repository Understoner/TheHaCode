<rect x="452" y="100" width="690" height="170" rx="14" fill="#FFFFFF" stroke="#E8EDF1" stroke-width="1"/>
<text x="472" y="130" font-size="16" font-weight="600" fill="#16242B">Über mich</text>
<text x="472" y="156" font-size="13" fill="#16242B">Als Director of Digitalisation in der IT-Industrie habe ich hautnah erlebt, wie stark</text>
<text x="472" y="174" font-size="13" fill="#16242B">Atemgewohnheiten die kognitive Leistungsfähigkeit beeinflussen — und wie schnell</text>
<text x="472" y="192" font-size="13" fill="#5A6B75">sich das mit gezieltem Training verändert. TheHaCode ist meine Antwort auf die Frage,</text>
<text x="472" y="210" font-size="13" fill="#5A6B75">wie man Atemcoaching zugänglich und messbar macht.</text>
<text x="472" y="252" font-size="13" font-weight="500" fill="#3B6C82">Vollständige Geschichte lesen →</text>

