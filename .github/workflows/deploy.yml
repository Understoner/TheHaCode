name: Deploy

# Ausrollen in zwei Stufen.
#
#   Push auf develop  ->  Supabase Staging     ->  auf Hostinger warten
#                     ->  Smoke-Tests          ->  Beförderung nach main
#   Push auf main     ->  Supabase Production  ->  auf Hostinger warten
#                     ->  Smoke-Tests
#
# WICHTIG: Hostinger baut selbststaendig bei jedem Push auf den verbundenen
# Branch. Diese Pipeline stoesst das Deployment also NICHT an, sondern wartet
# darauf und prueft danach. Daraus folgt die Regel aus SAD §2.6: Migrationen
# sind ausnahmslos additiv, weil die Reihenfolge nicht erzwingbar ist.

on:
  push:
    branches: [develop, main]
  # GITHUB_TOKEN-Pushes loesen keine anderen on:push-Workflows aus (GitHubs
  # eigener Schutz gegen Endlosschleifen). Der promote-Job pusht genau damit
  # nach main, deshalb stoesst er diesen Workflow hier manuell noch mal an.
  workflow_dispatch:

# Warum die Sperre je Job steht und nicht ueber dem ganzen Workflow
# ------------------------------------------------------------------
# Frueher stand hier eine Gruppe fuer den gesamten Lauf. Damit war immer nur
# EIN Deploy je Branch unterwegs - und ein Lauf gilt erst als beendet, wenn
# auch seine Befoerderung durch ist. Eine auf Freigabe wartende Befoerderung
# hat deshalb jeden weiteren Staging-Rollout blockiert, und zwar stumm: der
# neue Lauf stand einfach auf "pending", ohne Meldung, ohne Grund.
#
# Am 15.08.2026 hat das eine Stunde gekostet und obendrein einen falschen
# Alarm ausgeloest: der verzoegerte Lauf startete 32 Minuten nach dem Build,
# und die damals zeitbasierte Deployment-Pruefung konnte nie mehr wahr werden.
#
# Jetzt hat jeder Job seine eigene Gruppe. Zwei Dinge folgen daraus:
#   * Eine wartende Befoerderung haelt niemanden mehr auf. Der naechste Push
#     rollt sofort nach Staging aus.
#   * Ausrollen bleibt trotzdem serialisiert - zwei Migrationslaeufe gegen
#     dieselbe Datenbank koennen sich nicht ueberholen.
#
# cancel-in-progress bleibt ueberall false, und das ist hier keine Bequemlichkeit:
# diese Jobs fuehren "supabase db push" aus. Einen laufenden Migrationsschritt
# abzubrechen, weil zufaellig jemand anderes pusht, waere der teuerste
# denkbare Weg, ein bisschen Wartezeit zu sparen.

# Grundsaetzlich nur Lesen. Was mehr braucht (die Befoerderung pusht nach
# main), sagt es am Job selbst.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- STAGING
  staging:
    if: github.ref == 'refs/heads/develop'
    name: Staging ausrollen und pruefen
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: rollout-staging
      cancel-in-progress: false
    timeout-minutes: 25
    outputs:
      smoke: ${{ steps.smoke.outcome }}
      # Fuer den Security-Scan: STAGING_URL ist eine Environment-Variable und
      # nur in Jobs mit environment: staging lesbar. So braucht der Scan das
      # Environment (und dessen Secrets) nicht.
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Startzeit merken
        id: t0
        run: echo "value=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # FESTGENAGELT statt "latest" (06.09.2026). Grund: das CLI bestimmt
          # nicht nur sich selbst, sondern auch die Images und das Verhalten der
          # oertlichen Datenbank - und damit, was die pgTAP-Tests ueberhaupt
          # pruefen koennen. Mit 2.116.0 erteilte die oertliche Umgebung bei
          # nicht gesetztem auto_expose_new_tables wieder pauschale Rechte an
          # anon und authenticated; dreizehn Missbrauchstests in sechs Dateien
          # wurden dadurch stumm, ohne dass sich eine Zeile Code geaendert
          # haette. Die CI war an dem Tag rot, obwohl niemand etwas kaputt
          # gemacht hatte. Ein Werkzeug, das sich unter der Hand aendert, ist
          # bei einer Pruefstrecke das Gegenteil dessen, was sie leisten soll.
          #
          # Hochziehen ist eine bewusste Handlung: Version hier aendern,
          # "supabase db reset && supabase test db" oertlich mit genau dieser
          # Version laufen lassen, erst dann committen. Dieselbe Zahl steht in
          # deploy.yml an drei Stellen - alle vier gehoeren gemeinsam bewegt.
          version: 2.116.0

      - name: Migrationen nach Staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Edge Functions nach Staging
        if: hashFiles('supabase/functions/**') != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Auf Hostinger-Deployment warten
        env:
          TARGET_URL: ${{ vars.STAGING_URL }}
          STARTED_AT: ${{ steps.t0.outputs.value }}
        run: bash scripts/wait-for-deploy.sh "$TARGET_URL" "$STARTED_AT" "$GITHUB_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Smoke-Tests gegen Staging
        id: smoke
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: npm run e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 7

  # ------------------------------------------------------------- SECURITY
  # Der Security-Scan (scripts/security/scan.mjs, Entscheidung 30.10.2026)
  # laeuft vor jeder Befoerderung nach Live. Er BERICHTET nur - der Bericht
  # steht in der Zusammenfassung dieses Laufs und als Artifact. Ausgewertet
  # wird er auf Zuruf, umgesetzt nach Absprache. Fuer eine harte Sperre:
  # --strict an den Scan-Aufruf haengen.
  #
  # Bewusst OHNE Secrets und nur mit Leserechten: Die Werkzeuge kommen von
  # aussen. Selbst wenn eines kompromittiert waere (wie Trivy im Maerz 2026),
  # gaebe es hier nichts zu stehlen.
  security:
    if: github.ref == 'refs/heads/develop'
    name: Security-Scan (Bericht)
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Ganze Historie: Gitleaks prueft alle Commits, GuardDog und der
          # Abhaengigkeitsvergleich brauchen origin/main als Basis.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # Dieselbe Version wie in ci.yml (siehe Begruendung dort).
          version: 2.116.0

      # Nur fuer Splinter: die Datenbank aus den Migrationen, lokal im Runner.
      - name: Lokale Supabase-Instanz starten
        run: supabase start

      - name: Security-Scan
        env:
          ZAP_TARGET: ${{ needs.staging.outputs.url }}
        run: npm run security:scan -- --zap "$ZAP_TARGET" --base origin/main --out security-reports/ci

      - name: Bericht in die Zusammenfassung
        if: always()
        run: cat security-reports/ci/BERICHT.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-report
          path: security-reports/ci/
          retention-days: 30

  # ------------------------------------------------------------- BEFOERDERUNG
  promote:
    if: github.ref == 'refs/heads/develop'
    name: Nach main befoerdern
    # Auch auf den Security-Scan: Ohne Bericht keine Auslieferung nach Live.
    needs: [staging, security]
    runs-on: ubuntu-latest
    # Eigene Gruppe: hier wird gewartet, und Warten darf nichts blockieren.
    concurrency:
      group: promote-to-main
      cancel-in-progress: false
    # Das GitHub-Environment "production" traegt die Freigaberegel.
    # Mit hinterlegtem Reviewer ist die Beförderung ein Klick; ohne Reviewer
    # laeuft sie vollautomatisch durch. Empfehlung siehe docs/DEPLOYMENT.md.
    environment: production
    permissions:
      contents: write
      actions: write
    steps:
      # Bewusst MIT gespeicherten Zugangsdaten: der naechste Schritt pusht nach
      # main. Der Job laedt keine Artifacts hoch, ueber die sie abfliessen
      # koennten (das ist das Risiko hinter "artipacked").
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: develop nach main mergen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --ff-only origin/develop || {
            echo "::error::main ist develop vorausgelaufen. Bitte develop rebasen."
            exit 1
          }
          git push origin main

      - name: Production-Job anstossen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

  # ------------------------------------------------------------- PRODUCTION
  production:
    if: github.ref == 'refs/heads/main'
    name: Production ausrollen und pruefen
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: rollout-production
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Startzeit merken
        id: t0
        run: echo "value=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # FESTGENAGELT statt "latest" (06.09.2026). Grund: das CLI bestimmt
          # nicht nur sich selbst, sondern auch die Images und das Verhalten der
          # oertlichen Datenbank - und damit, was die pgTAP-Tests ueberhaupt
          # pruefen koennen. Mit 2.116.0 erteilte die oertliche Umgebung bei
          # nicht gesetztem auto_expose_new_tables wieder pauschale Rechte an
          # anon und authenticated; dreizehn Missbrauchstests in sechs Dateien
          # wurden dadurch stumm, ohne dass sich eine Zeile Code geaendert
          # haette. Die CI war an dem Tag rot, obwohl niemand etwas kaputt
          # gemacht hatte. Ein Werkzeug, das sich unter der Hand aendert, ist
          # bei einer Pruefstrecke das Gegenteil dessen, was sie leisten soll.
          #
          # Hochziehen ist eine bewusste Handlung: Version hier aendern,
          # "supabase db reset && supabase test db" oertlich mit genau dieser
          # Version laufen lassen, erst dann committen. Dieselbe Zahl steht in
          # deploy.yml an drei Stellen - alle vier gehoeren gemeinsam bewegt.
          version: 2.116.0

      - name: Migrationen nach Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Edge Functions nach Production
        if: hashFiles('supabase/functions/**') != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Auf Hostinger-Deployment warten
        env:
          TARGET_URL: ${{ vars.PRODUCTION_URL }}
          STARTED_AT: ${{ steps.t0.outputs.value }}
        run: bash scripts/wait-for-deploy.sh "$TARGET_URL" "$STARTED_AT" "$GITHUB_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Smoke-Tests gegen Production
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: npm run e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 30

      # Schlaegt Production fehl, ist das kein automatischer Rollback —
      # in hPanel liegt unter Deployments die vorherige Version zum
      # Zurueckrollen bereit. Bewusst manuell (docs/DEPLOYMENT.md).
      - name: Bei Fehlschlag Hinweis ausgeben
        if: failure()
        run: |
          echo "::error::Production-Smoke fehlgeschlagen. In hPanel unter" \
               "Deployments die letzte gruene Version erneut ausrollen."
