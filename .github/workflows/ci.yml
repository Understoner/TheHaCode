name: CI

# Läuft auf jedem PR nach develop (DEPLOYMENT.md §4, Schritt 3) und ist der
# Status-Check "verify", den die Branch Protection auf develop/main verlangt
# (DEPLOYMENT.md §3). Deploy.yml (push-getriggert) wiederholt diese Prüfungen
# bewusst nicht — sie sind hier bereits Merge-Voraussetzung.

on:
  pull_request:
    branches: [develop, main]

# Nur Lesen: der Job baut und prueft, er schreibt nirgends hin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + lint + vitest (CLAUDE.md: "npm run verify" vor jedem PR)
      - name: Typecheck, Lint, Vitest
        run: npm run verify

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # FESTGENAGELT statt "latest" (06.09.2026). Grund: das CLI bestimmt
          # nicht nur sich selbst, sondern auch die Images und das Verhalten der
          # oertlichen Datenbank - und damit, was die pgTAP-Tests ueberhaupt
          # pruefen koennen. Mit 2.116.0 erteilte die oertliche Umgebung bei
          # nicht gesetztem auto_expose_new_tables wieder pauschale Rechte an
          # anon und authenticated; dreizehn Missbrauchstests in sechs Dateien
          # wurden dadurch stumm, ohne dass sich eine Zeile Code geaendert
          # haette. Die CI war an dem Tag rot, obwohl niemand etwas kaputt
          # gemacht hatte. Ein Werkzeug, das sich unter der Hand aendert, ist
          # bei einer Pruefstrecke das Gegenteil dessen, was sie leisten soll.
          #
          # Hochziehen ist eine bewusste Handlung: Version hier aendern,
          # "supabase db reset && supabase test db" oertlich mit genau dieser
          # Version laufen lassen, erst dann committen. Dieselbe Zahl steht in
          # deploy.yml an drei Stellen - alle vier gehoeren gemeinsam bewegt.
          version: 2.116.0

      - name: Lokale Supabase-Instanz starten
        run: supabase start

      # Meldet zerstörerische Schemaänderungen — die technische Absicherung
      # der additiven-Migrationen-Regel aus CLAUDE.md / SAD §2.6.
      - name: Migrationen linten
        run: npm run db:lint

      - name: Migrationen einspielen
        run: npm run db:reset

      - name: pgTAP
        run: npm run db:test

      # Platzhalterwerte, absichtlich offensichtlich falsch: dieser Schritt
      # prueft nur, ob sich der Export bauen laesst - ausgeliefert wird hier
      # nichts. Die echten Werte setzt Hostinger je Website (DEPLOYMENT.md §2)
      # und backt sie zur Bauzeit ein.
      #
      # Noetig seit dem Sessions-Player: src/lib/supabase.ts wirft beim Laden,
      # wenn die Variablen fehlen, und das statische Rendern der Route
      # /sessions/[id] fuehrt dieses Modul aus. Die Liste allein tat das nicht,
      # deshalb lief die CI bis dahin ohne Konfiguration durch. Der laute
      # Fehlschlag bei fehlender Konfiguration ist erwuenscht und bleibt - er
      # trifft jetzt nur nicht mehr die CI, die keine echten Werte haben darf.
      - name: Web-Build
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-platzhalter.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-platzhalter-kein-echter-schluessel
        run: npm run build:web
